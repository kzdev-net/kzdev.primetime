# Optional: build DocFX docs and deploy to GitHub Pages.
# To enable deployment: Repository Settings → Pages → Build and deployment → Source: GitHub Actions.
# Trigger the action on push to main
on:
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  actions: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Dotnet Setup
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - run: dotnet restore Source/KZDev.PrimeTime.slnx
      - run: dotnet build -c Release Source/KZDev.PrimeTime.slnx
      - name: Verify support and release-notes sources exist
        run: |
          set -e
          test -f SUPPORT.md
          test -f Source/Docs/articles/support-and-lifecycle.md
          test -f Source/Docs/articles/release-notes.md
          test -f Source/Docs/Notes/KZDev.PrimeTime.release-notes.md
          test -f Source/Docs/Notes/KZDev.SystemClock.PrimeTime.release-notes.md
          test -f Source/Docs/Notes/KZDev.PrimeTime.Testing.release-notes.md
          test -f Source/Docs/Notes/KZDev.SystemClock.PrimeTime.Testing.release-notes.md
      - run: dotnet tool update -g docfx
      - run: docfx Source/Docs/docfx.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "Source/Docs/_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
